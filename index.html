<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="fan56的技术博客:AI 工具链、终端工作流与自动化实践。"
    />
    <title>fan56的技术博客</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%2316181D'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%230891B2'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        /* theme paper(纸白) - Light */
        --bg: #f6f7f9;
        --tx: #16181d;
        --tx2: #525c6e;
        --tx3: #6b7686;
        --ac: #0891b2;
        --accent-soft: rgba(8, 145, 178, 0.1);
        --line: rgba(22, 24, 29, 0.08);
        --line2: rgba(22, 24, 29, 0.14);
        --sans:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC",
          "Microsoft YaHei", system-ui, sans-serif;
        --disp:
          "Space Grotesk", -apple-system, "SF Pro Display", "PingFang SC",
          system-ui, sans-serif;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        padding: 12vh 48px 64px;
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 96px;
      }
      a {
        color: inherit;
      }
      /* ---------- Intro (sticky left rail) ---------- */
      .intro {
        align-self: start;
        position: sticky;
        top: 40px;
      }
      .kicker {
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ac);
        margin-bottom: 20px;
      }
      h1 {
        font-family: var(--disp);
        font-size: clamp(2.5rem, 4vw, 3.5rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.05;
        margin-bottom: 20px;
      }
      .tagline {
        color: var(--tx2);
        font-size: 15px;
        max-width: 30ch;
        margin-bottom: 36px;
      }
      .links {
        list-style: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 56px;
      }
      .links a {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--tx2);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: color 0.3s var(--ease);
      }
      .links a::before {
        content: "";
        width: 14px;
        height: 1px;
        background: var(--line2);
        transition: background 0.3s var(--ease);
      }
      .links a:hover {
        color: var(--ac);
      }
      .links a:hover::before {
        background: var(--ac);
      }
      .foot {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--tx3);
      }
      /* ---------- Posts (editorial index) ---------- */
      .posts {
        min-width: 0;
      }
      .post {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 24px;
        padding: 44px 0;
        border-top: 1px solid var(--line);
        transition: background 0.4s var(--ease);
      }
      .post:hover {
        background: linear-gradient(
          90deg,
          var(--accent-soft),
          transparent 60%
        );
      }
      .post-date {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--tx3);
        padding-top: 6px;
        white-space: nowrap;
      }
      .post-body {
        min-width: 0;
      }
      .post-cat {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--tx3);
        margin-bottom: 12px;
      }
      .post-title {
        font-family: var(--disp);
        font-size: clamp(1.45rem, 2.2vw, 1.85rem);
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.2;
        margin-bottom: 12px;
        text-decoration: none;
        display: inline-block;
        transition: color 0.4s var(--ease);
      }
      .post-title:hover {
        color: var(--ac);
      }
      .post-desc {
        color: var(--tx2);
        font-size: 15px;
        max-width: 60ch;
      }
      /* ---------- Motion (fade-up, staggered) ---------- */
      .reveal {
        opacity: 0;
        transform: translateY(18px);
        transition:
          opacity 0.7s var(--ease),
          transform 0.7s var(--ease);
      }
      .reveal.in {
        opacity: 1;
        transform: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .reveal {
          opacity: 1;
          transform: none;
          transition: none;
        }
        html {
          scroll-behavior: auto;
        }
        .post,
        .post-title,
        .links a {
          transition: none;
        }
      }
      /* ---------- Mobile (< 768px) ---------- */
      @media (max-width: 767px) {
        .wrap {
          grid-template-columns: 1fr;
          gap: 56px;
          padding: 48px 24px 40px;
        }
        .intro {
          position: static;
        }
        .links {
          margin-bottom: 0;
        }
        .post {
          grid-template-columns: 1fr;
          gap: 6px;
          padding: 32px 0;
        }
        .post-date {
          padding-top: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <aside class="intro reveal">
        <div class="kicker">fan56 的技术博客</div>
        <h1>fan56的技术博客</h1>
        <p class="tagline">
          AI 工具链、终端工作流与自动化实践。持续更新。
        </p>
        <ul class="links">
          <li><a href="https://github.com/fan56/tech-blog" target="_blank" rel="noopener">GitHub</a></li>
        </ul>
        <p class="foot">© 2026 · 单文件 HTML</p>
      </aside>

      <main class="posts">
        <article class="post reveal">
          <div class="post-date">2026-08-05</div>
          <div class="post-body">
            <div class="post-cat">工具链</div>
            <a class="post-title" href="pi/">Pi · 我的终端 AI 编排者</a>
            <p class="post-desc">
              极简内核与 85 个技能、20 个智能体、4 个 MCP 的叠加。一张动画架构图讲清
              pi 引擎、扩展层、Agent 团队与外部接入。
            </p>
          </div>
        </article>
        <article class="post reveal">
          <div class="post-date">2026-07-23</div>
          <div class="post-body">
            <div class="post-cat">工具链</div>
            <a class="post-title" href="pi-agent-intro/">Pi-agent 工具链:一条命令,从调研到上线</a>
            <p class="post-desc">
              rpiv 当导演,lean-ctx 做地基,15 个 sub-agent 与 89 个 skill 干活,
              一条命令从调研到上线。
            </p>
          </div>
        </article>
      </main>
    </div>

    <script>
      // 入场动画:IntersectionObserver + stagger,reduced-motion 降级
      var revealEls = document.querySelectorAll(".reveal");
      function showAll() {
        revealEls.forEach(function (el) {
          el.classList.add("in");
        });
      }
      if (
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches
      ) {
        showAll();
      } else if ("IntersectionObserver" in window) {
        var io = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("in");
                io.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.1 },
        );
        revealEls.forEach(function (el, i) {
          el.style.transitionDelay = i * 90 + "ms";
          io.observe(el);
        });
      } else {
        showAll();
      }
    </script>
  </body>
</html>
