<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Tech Blog — 个人技术博客:AI 工具链、终端工作流、车云工程。"
    />
    <title>Tech Blog</title>
    <style>
      :root {
        --bg: #050505;
        --l1: #0d0f14;
        --l2: #11141b;
        --tx: #f4f5f7;
        --tx2: #9aa1ac;
        --tx3: #5b6270;
        --line: rgba(255, 255, 255, 0.08);
        --line2: rgba(255, 255, 255, 0.12);
        --ac: #22d3ee;
        --ac-soft: rgba(34, 211, 238, 0.1);
        --sans:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC",
          "Microsoft YaHei", system-ui, sans-serif;
        --disp:
          "Space Grotesk", -apple-system, "SF Pro Display", "PingFang SC",
          system-ui, sans-serif;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 860px;
        margin: 0 auto;
        padding: 64px 24px 48px;
      }
      /* ---------- Header ---------- */
      header {
        padding-bottom: 56px;
        border-bottom: 1px solid var(--line);
      }
      .kicker {
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ac);
        margin-bottom: 16px;
      }
      h1 {
        font-family: var(--disp);
        font-size: clamp(2.5rem, 5vw, 4rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.1;
        margin-bottom: 16px;
      }
      .tagline {
        color: var(--tx2);
        max-width: 55ch;
        font-size: 15px;
      }
      /* ---------- Posts ---------- */
      .posts {
        list-style: none;
        padding: 0;
      }
      .posts li {
        padding: 32px 0;
        border-bottom: 1px solid var(--line);
      }
      .post-meta {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--tx3);
        margin-bottom: 8px;
      }
      .post-link {
        text-decoration: none;
        color: var(--tx);
      }
      .post-title {
        font-family: var(--disp);
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin-bottom: 8px;
        transition: color 0.4s var(--ease);
      }
      .post-link:hover .post-title {
        color: var(--ac);
      }
      .post-desc {
        color: var(--tx2);
        font-size: 15px;
        max-width: 65ch;
      }
      .post-more {
        display: inline-block;
        margin-top: 12px;
        font-family: var(--mono);
        font-size: 13px;
        color: var(--ac);
        text-decoration: none;
        border: 1px solid var(--line2);
        border-radius: 999px;
        padding: 4px 14px;
        transition:
          border-color 0.3s var(--ease),
          background 0.3s var(--ease);
      }
      .post-more:hover {
        border-color: var(--ac);
        background: var(--ac-soft);
      }
      /* ---------- Footer ---------- */
      footer {
        padding-top: 40px;
        color: var(--tx3);
        font-size: 13px;
        font-family: var(--mono);
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
      }
      footer a {
        color: var(--tx3);
        text-decoration: none;
        transition: color 0.3s var(--ease);
      }
      footer a:hover {
        color: var(--ac);
      }
      /* ---------- Motion (fade-up) ---------- */
      .reveal {
        opacity: 0;
        transform: translateY(16px);
        transition:
          opacity 0.7s var(--ease),
          transform 0.7s var(--ease);
      }
      .reveal.in {
        opacity: 1;
        transform: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .reveal {
          opacity: 1;
          transform: none;
          transition: none;
        }
        html {
          scroll-behavior: auto;
        }
      }
      /* ---------- Mobile ---------- */
      @media (max-width: 640px) {
        .wrap {
          padding: 40px 20px 32px;
        }
        header {
          padding-bottom: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="reveal">
        <div class="kicker">Tech Blog</div>
        <h1>个人技术博客</h1>
        <p class="tagline">
          AI 工具链、终端工作流、自动化与车云工程实践的记录。持续更新。
        </p>
      </header>

      <main>
        <ul class="posts">
          <li class="reveal">
            <div class="post-meta">2026-08-05 · 工具链</div>
            <a class="post-link" href="pi/">
              <h2 class="post-title">Pi · 我的终端 AI 编排者</h2>
            </a>
            <p class="post-desc">
              极简内核与 85 个技能、20 个智能体、4 个 MCP 的叠加 —— 一张动画架构图讲清
              pi 引擎、扩展层、Agent 团队与外部接入。
            </p>
            <a class="post-more" href="pi/">阅读全文 →</a>
          </li>
        </ul>
      </main>

      <footer>
        <span>© 2026 Tech Blog</span>
        <span>
          <a href="https://github.com/fan56/tech-blog" target="_blank" rel="noopener">
            GitHub
          </a>
        </span>
      </footer>
    </div>

    <script>
      // 入场动画:IntersectionObserver + reduced-motion 降级
      const revealEls = document.querySelectorAll(".reveal");
      if (
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches
      ) {
        revealEls.forEach((el) => el.classList.add("in"));
      } else if ("IntersectionObserver" in window) {
        const io = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("in");
                io.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.15 },
        );
        revealEls.forEach((el) => io.observe(el));
      } else {
        revealEls.forEach((el) => el.classList.add("in"));
      }
    </script>
  </body>
</html>
